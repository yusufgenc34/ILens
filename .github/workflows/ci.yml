name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET for fixture export verification
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore independent IL verifier
        run: dotnet tool restore
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install dependencies
        run: npm ci
      - name: Check Rust formatting
        run: npm run format:check
      - name: Run Rust and frontend tests
        run: npm test
      - name: Build browser WASM
        run: npm run build:wasm
      - name: Check TypeScript
        run: npm run typecheck
      - name: Lint TypeScript and Rust
        run: npm run lint
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test development application
        run: npm run test:e2e
      - name: Build production application
        run: npm run build:app
      - name: Test production application
        run: npm run test:production
      - name: Build static application
        run: npm run build:pages:app
      - name: Test static application
        run: npm run test:pages
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker application
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and start Compose
        run: ILENS_PORT=3100 docker compose up --build --detach --wait --wait-timeout 90
      - name: Set up .NET for fixture export verification
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore independent IL verifier
        run: dotnet tool restore
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install browser test tools
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test container in Chromium
        run: npm run test:production
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
      - name: Print container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-browser-diagnostics
          path: |
            test-results/production/
            playwright-report/production/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop containers
        if: always()
        run: docker compose down
